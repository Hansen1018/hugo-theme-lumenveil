version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
# There is deliberately no `pip` ecosystem entry, and that is not because
# the repository is dependency-free. The scripts under scripts/ import only
# the Python standard library (argparse, collections, html, json, os, re,
# shutil, struct, subprocess, sys, tempfile, urllib, zlib), so they need no
# manifest. The repository root does have one third-party dependency:
# verify.py and dark-check.py drive Playwright, which CONTRIBUTING.md
# documents as a manual install. Dependabot's pip ecosystem tracks a
# manifest file, and there is none, so an entry would sit here permanently
# skipped and read as though something were being tracked. Add one in the
# same commit that introduces a requirements.txt.
#
# The CDN libraries the theme loads -- highlight.js, KaTeX, PhotoSwipe --
# are pinned in layouts/ and are invisible to every ecosystem above: they
# are not packages, they are strings in a template. That is why they are
# checked by scripts/test-cdn-versions.py (on every pull request) and by
# .github/workflows/cdn-versions.yml (on a schedule).
