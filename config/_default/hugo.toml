# Theme-provided configuration. Hugo auto-merges files in this directory
# into consumer site config, so settings here propagate to anyone who
# installs the theme.

[markup]
  # Enable Hugo's goldmark attribute syntax on block elements (Hugo v0.112+).
  # Without this, {.className} / {#id} / {cite="..." caption="..."} on a
  # blockquote pass through as literal text. The render hook
  # layouts/_default/_markup/render-blockquote.html re-emits these attributes
  # on the opening tag and uses cite/caption to render the <figure>/<figcaption>
  # branch — both features are silently broken without this setting (R4).
  # Per OCR 3980746603: must live under config/_default/, NOT theme-root
  # hugo.toml — Hugo does not merge a theme's root hugo.toml into consumers.
  [markup.goldmark.parser.attribute]
    block = true
