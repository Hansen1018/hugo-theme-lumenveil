{{ define "main" }}
<section class="page-hero">
  <div class="breadcrumbs">
    <a href="{{ site.Home.RelPermalink }}">首页</a><span>/</span><span>{{ .Title }}</span>
  </div>
  {{ $eyebrow := or .Params.eyebrow "About" }}
  <span class="eyebrow">{{ $eyebrow }}</span>
  <h1>{{ .Title }}</h1>
  {{ with .Description }}<p>{{ . }}</p>{{ end }}
</section>

<section class="section section--compact" data-reveal>
  <div class="article-layout">
    <div class="article-main glass">
      <div class="prose">{{ .Content }}</div>
    </div>
    {{ if .TableOfContents }}{{ if ne .Params.toc false }}
    <aside class="toc">
      <div class="toc__inner">
        <span class="eyebrow">On this page</span>
        <h2>文章目录</h2>
        {{ .TableOfContents }}
      </div>
    </aside>
    {{ end }}{{ end }}
  </div>
</section>
{{ end }}
