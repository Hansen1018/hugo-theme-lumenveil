{{ define "main" }}
<article class="article fade-up">
  <header class="article-header">
    <div class="breadcrumbs"><a href="{{ site.Home.RelPermalink }}">首页</a><span>/</span><span>{{ .Title }}</span></div>
    <h1>{{ .Title }}</h1>
    {{ with .Description }}<p class="article-deck">{{ . }}</p>{{ end }}
  </header>
  <div class="article-layout">
    <div class="article-main glass"><div class="prose">{{ .Content }}</div></div>
    {{ if .TableOfContents }}{{ if ne .Params.toc false }}
    <aside class="toc">
      <div class="toc__inner">
        <span class="eyebrow">On this page</span>
        <h2>文章目录</h2>
        {{ .TableOfContents }}
      </div>
    </aside>
    {{ end }}{{ end }}
  </div>
</article>
{{ end }}
