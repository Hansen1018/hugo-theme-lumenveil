<header class="site-header" data-header>
  <div class="header-inner">
    <a class="brand brand--text" href="{{ site.Home.RelPermalink }}" aria-label="{{ site.Title }} 首页">
      <span class="brand__text">{{ site.Params.brand | default (printf "%s's Blog" site.Params.author) | default site.Title }}<span>.</span></span>
    </a>
    <nav class="main-nav" id="main-nav" aria-label="主导航">
      {{ range site.Menus.main }}
        <a href="{{ .URL }}"{{ if $.IsMenuCurrent .Menu . }} class="is-active" aria-current="page"{{ end }}>{{ .Name }}</a>
      {{ end }}
    </nav>
    <div class="header-actions">
      <button class="icon-button" type="button" data-search-open aria-label="搜索" title="搜索">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.35-4.35m2.35-5.65a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z"/></svg>
      </button>
      <button class="icon-button" type="button" data-theme-toggle aria-label="切换浅色模式" title="切换浅色模式">
        <svg class="theme-icon--moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.4A8.5 8.5 0 0 1 9.6 3.5 8.5 8.5 0 1 0 20.5 14.4Z"/></svg>
        <svg class="theme-icon--sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"/></svg>
      </button>
      {{ with site.Home.OutputFormats.Get "RSS" }}
        <a class="icon-button" href="{{ .RelPermalink }}" aria-label="订阅 RSS" title="订阅 RSS">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4a15 15 0 0 1 15 15M5 10a9 9 0 0 1 9 9M6 18.5h.01"/></svg>
        </a>
      {{ end }}
      <button class="menu-toggle" type="button" aria-controls="main-nav" aria-expanded="false" data-menu-toggle>
        <span></span><span></span><span></span><span class="sr-only">打开菜单</span>
      </button>
    </div>
  </div>
</header>
