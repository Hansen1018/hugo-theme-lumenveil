name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.146.0'
          extended: true
      - run: cd exampleSite && hugo --minify
      - name: Verify CSS class cross-reference
        run: |
          cd "${GITHUB_WORKSPACE}"
          rg -oN '\.[a-z][a-z0-9_-]+' assets/css/components/*.css assets/css/main.css | sort -u > /tmp/defined.txt
          rg -oN 'class="[^"]+"' layouts/ assets/js/main.js | sed 's/class="//;s/"//' | tr ' ' '\n' | sort -u > /tmp/used.txt
          diff <(sed 's/.*://' /tmp/defined.txt | sort -u) <(sed 's/.*://' /tmp/used.txt | sort -u) || (echo 'Unused CSS classes detected'; exit 1)
