{{ $cols := default "3" (.Get "cols") }}
{{ $imgs := default "" (.Get "images") }}
<div class="pswp-gallery" data-pswp-cols="{{ $cols }}">
{{ range $imgs | split "," }}
{{ $src := trim . " " }}
{{ if $src }}
<a href="{{ $src | safeURL }}" class="pswp-item" data-pswp-src="{{ $src | safeURL }}" data-pswp-width="1600" data-pswp-height="1067"><img src="{{ $src | safeURL }}" alt="" loading="lazy" decoding="async"></a>
{{ end }}
{{ end }}
</div>
