<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 256" width="960" height="256" role="img" aria-label="Lumenveil">
  <title>Lumenveil</title>
  <defs>
    <linearGradient id="vesica" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7c5cff"/>
      <stop offset="45%" stop-color="#c4b5fd"/>
      <stop offset="55%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="lumen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c5cff"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="bloom" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <path d="M 64 128 C 64 -11 192 -11 192 128 C 192 267 64 267 64 128 Z" fill="url(#vesica)"/>
  <path d="M 64 128 C 64 -11 128 -11 128 128 C 128 267 64 267 64 128 Z" fill="#ffffff" opacity="0.10"/>
  <circle cx="128" cy="128" r="50" fill="url(#lumen)" filter="url(#bloom)"/>
  <circle cx="128" cy="128" r="6" fill="#ffffff"/>
  <text x="296" y="138" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', 'Inter', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="96" font-weight="800" fill="url(#wordmark)" letter-spacing="-4" dominant-baseline="central">Lumenveil</text>
  <rect x="298" y="178" width="84" height="3" rx="1.5" fill="url(#accent)"/>
  <text x="298" y="208" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="500" fill="#94a3b8" letter-spacing="3" dominant-baseline="central">A LUMINOUS HUGO THEME</text>
</svg>
