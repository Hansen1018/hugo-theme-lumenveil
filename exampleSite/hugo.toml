baseURL = 'https://example.com/'
title = 'Lumenveil Example'
theme = 'lumenveil'

[module]
  [module.imports]
    path = 'github.com/Hansen1018/hugo-theme-lumenveil'
    disable = true

# Required output formats for search + taxonomy pages
[outputs]
  home = ['HTML', 'RSS', 'JSON']
  section = ['HTML', 'RSS']
  taxonomy = ['HTML', 'RSS']
  term = ['HTML', 'RSS']

[outputFormats.JSON]
  mediaType = 'application/json'
  baseName = 'index'
  isPlainText = true
  notAlternative = true

[pagination]
  pagerSize = 7

[taxonomies]
  category = 'categories'
  tag = 'tags'

[markup]
  [markup.highlight]
    noClasses = false
    guessSyntax = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
    ordered = false

[params]
  description = 'Demo site for the Lumenveil Hugo theme — glass surfaces, aurora ambience, light and dark modes.'
  author = 'Hansen'
  initial = 'H'
  # avatar = '/images/avatar.png'  # uncomment once you drop an image at
  #                                 exampleSite/static/images/avatar.png
  # Left off on purpose: pointing at a file the demo site does not ship
  # renders a broken <img>, and because a non-empty string is truthy to
  # `with`, the `initial` letter fallback below can never take over.
  role = 'Writer · Developer'
  tagline = 'A luminous reading-first experience.'
  location = 'Your City'
  status = 'Currently writing'
  email = 'you@example.com'
  github = 'https://github.com/Hansen1018'
  twitter = 'https://twitter.com/Hansen1018'
  since = 2024
  copyright = 'CC BY-NC-ND 4.0 DEED'
  copyright_url = 'https://creativecommons.org/licenses/by-nc-nd/4.0/'
  mainSections = ['posts']
  # exampleSite keeps hljs on purpose. The theme ships no Chroma stylesheet
  # (no chroma.css in assets/css/components) and head.html loads the monokai
  # theme only in this branch, so flipping to the Chroma path would render the
  # demo's code blocks unstyled. The Chroma path is still the default for
  # consumers who do not opt in — see render-codeblock.html.
  highlight = 'hljs'
  # Opt-in KaTeX math rendering (auto-render targets .article/.article-main/.prose; supports $$...$$ / \\[...\\] display + \\(...\\) inline - bare $...$ deliberately not registered)
  math = true

  # Comments — enable the Artalk demo wiring so exampleSite can demonstrate
  # the resilient loader. The server URL is a placeholder; CSP will block the
  # cross-origin script in the Playwright probe, which exercises the
  # .artalk-fallback path. Replace with a real Artalk backend in production.
  [params.comments]
    service = 'artalk'
    server = 'https://your-artalk.example.com'
    site = 'Lumenveil Demo'

[menus]
  [[menus.main]]
    name = 'Home'
    pageRef = '/'
    weight = 10
  [[menus.main]]
    name = 'Posts'
    pageRef = '/posts'
    weight = 20
  [[menus.main]]
    name = 'About'
    pageRef = '/about'
    weight = 25
  [[menus.main]]
    name = 'Categories'
    pageRef = '/categories'
    weight = 30
  [[menus.main]]
    name = 'Tags'
    pageRef = '/tags'
    weight = 40

[permalinks]
  posts = '/posts/:slug/'

# `imaging.quality` was deprecated in Hugo v0.163.0; Hugo's own docs state the
# replacement applies to AVIF, JPEG and WebP only. PNG/GIF/TIFF have no quality
# setting to migrate — they are lossless and controlled by encoder settings, so
# there is nothing here for them to inherit. The older `jpegQuality` /
# `webpQuality` / `pngQuality` keys are themselves deprecated (since v0.83.0) and
# each cover only one format, leaving the rest on the encoder default.
#
# These per-format keys only exist from 0.163.0. On the 0.146.0 CI leg they are
# unknown keys: Hugo ignores them silently, so the build stays green and the
# encoder default applies. That is a limitation of the example site's own config
# on an old Hugo, not a theme defect, and it is the lesser of the two options —
# the global `[imaging] quality` form this replaced is itself deprecated on
# 0.163.0+ and will be removed. No single form is clean across the whole
# 0.146.0+ range, so keep the forward-compatible one.
#
# Measured, not assumed: on 0.146.0 the per-format keys here leave JPEG, WebP
# and AVIF byte-identical across quality 20, quality 85 and no config at all,
# while the scalar form moves all of them. On 0.167.0 the two forms agree. That
# inertness is invisible from a build result, so
# scripts/test-imaging-config.py asserts it in both directions — a future Hugo
# that starts honouring these below 0.163.0, or that starts warning on unknown
# keys, fails the build instead of quietly changing what the example site emits.
[imaging.jpeg]
  quality = 85
[imaging.webp]
  quality = 85
[imaging.avif]
  quality = 85
