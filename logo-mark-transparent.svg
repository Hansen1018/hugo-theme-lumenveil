  <path d="M 64 128 C 64 -11 192 -11 192 128 C 192 267 64 267 64 128 Z" fill="url(#vesica)"/>
  <path d="M 64 128 C 64 -11 128 -11 128 128 C 128 267 64 267 64 128 Z" fill="#ffffff" opacity="0.10"/>
