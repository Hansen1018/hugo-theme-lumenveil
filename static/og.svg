<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Lumenveil — A luminous Hugo theme">
  <title>Lumenveil — A luminous Hugo theme</title>
  <defs>
    <radialGradient id="g1" cx="85%" cy="15%" r="55%">
      <stop offset="0%" stop-color="#7c5cff" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="10%" cy="90%" r="55%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#fff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="vesica" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7c5cff"/>
      <stop offset="45%" stop-color="#c4b5fd"/>
      <stop offset="55%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="lumen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c5cff"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0v56" fill="none" stroke="#fff" stroke-opacity=".04"/>
    </pattern>
    <filter id="bloom" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="#0a0c12"/>
  <rect width="1200" height="630" fill="url(#g1)"/>
  <rect width="1200" height="630" fill="url(#g2)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <g transform="translate(80, 80)">
    <rect width="160" height="32" rx="16" fill="rgba(124,92,255,.18)" stroke="rgba(124,92,255,.42)"/>
    <text x="80" y="16" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#c4b5fd" text-anchor="middle" dominant-baseline="central" letter-spacing="2">HUGO THEME</text>
  </g>
  <text x="80" y="270" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="148" font-weight="800" fill="url(#title)" letter-spacing="-6">Lumenveil</text>
  <rect x="80" y="320" width="120" height="4" rx="2" fill="url(#accent)"/>
  <text x="80" y="370" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="34" fill="#e2e8f0" fill-opacity=".92">A luminous reading-first Hugo theme.</text>
  <g transform="translate(80, 420)" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" letter-spacing="2" fill="#cbd5e1">
    <g><rect width="142" height="30" rx="15" fill="rgba(255,255,255,.06)" stroke="rgba(255,255,255,.12)"/><text x="71" y="15" text-anchor="middle" dominant-baseline="central">AURORA · GLASS</text></g>
    <g transform="translate(154, 0)"><rect width="138" height="30" rx="15" fill="rgba(255,255,255,.06)" stroke="rgba(255,255,255,.12)"/><text x="69" y="15" text-anchor="middle" dominant-baseline="central">LIGHT + DARK</text></g>
    <g transform="translate(304, 0)"><rect width="118" height="30" rx="15" fill="rgba(255,255,255,.06)" stroke="rgba(255,255,255,.12)"/><text x="59" y="15" text-anchor="middle" dominant-baseline="central">CLIENT SEARCH</text></g>
    <g transform="translate(434, 0)"><rect width="148" height="30" rx="15" fill="rgba(255,255,255,.06)" stroke="rgba(255,255,255,.12)"/><text x="74" y="15" text-anchor="middle" dominant-baseline="central">PHOTOSWIPE GALLERY</text></g>
  </g>
  <text x="80" y="558" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#fff" fill-opacity=".42" letter-spacing="2">github.com/Hansen1018/hugo-theme-lumenveil</text>
  <g transform="translate(880, 165) scale(1.4)">
    <path d="M 64 128 C 64 -11 192 -11 192 128 C 192 267 64 267 64 128 Z" fill="url(#vesica)" opacity=".85"/>
    <path d="M 64 128 C 64 -11 128 -11 128 128 C 128 267 64 267 64 128 Z" fill="#ffffff" opacity=".10"/>
    <circle cx="128" cy="128" r="50" fill="url(#lumen)" filter="url(#bloom)"/>
    <circle cx="128" cy="128" r="6" fill="#ffffff"/>
  </g>
</svg>
