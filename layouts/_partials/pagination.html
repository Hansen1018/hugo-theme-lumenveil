{{ if gt .TotalPages 1 }}
<nav class="pagination" aria-label="分页">
  {{ with .Prev }}<a href="{{ .URL }}" rel="prev" class="pagination-item">← 上一页</a>{{ else }}<span class="pagination-item is-disabled" aria-disabled="true">← 上一页</span>{{ end }}
  <span class="pagination-pages">
    {{ range .Pagers }}{{ if eq .PageNumber $.PageNumber }}<span class="pagination-item is-active" aria-current="page">{{ .PageNumber }}</span>{{ else }}<a href="{{ .URL }}" class="pagination-item">{{ .PageNumber }}</a>{{ end }}{{ end }}
  </span>
  {{ with .Next }}<a href="{{ .URL }}" rel="next" class="pagination-item">下一页 →</a>{{ else }}<span class="pagination-item is-disabled" aria-disabled="true">下一页 →</span>{{ end }}
</nav>
{{ end }}
