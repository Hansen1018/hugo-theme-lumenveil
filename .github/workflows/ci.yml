name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege, declared explicitly rather than inherited. This workflow only
# checks out code and runs Hugo — it never writes to the repo — so a repo-wide
# default change to a wider GITHUB_TOKEN scope should not silently widen this
# job. Matches the explicit grant in ocr-review.yml, which additionally needs
# pull-requests: write to post review comments.
permissions:
  contents: read

# One build per ref. This workflow runs a two-version matrix, so without a
# group every push to the same PR branch re-runs both legs and the older run's
# result arrives last. Matches the convention in ocr-review.yml.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # A hung step (an unresponsive action download, a wedged Hugo build)
    # otherwise burns runner minutes up to the 6h GitHub default. These are
    # two plain builds; anything past 15 minutes is broken, not slow.
    timeout-minutes: 15
    # theme.toml declares min_version = "0.146.0" and README promises
    # "Hugo Extended 0.146.0 or newer", so that floor is part of the public
    # contract — test it. A single pinned version proved the opposite: pinned at
    # 0.146.0 this workflow missed 20 releases, and Hugo 0.163.0's
    # imaging.quality deprecation only surfaced after the pin was raised.
    # The upper leg is a pin too, so it does not track the tip on its own — bump
    # it by hand when cutting a release. Dependabot's github-actions ecosystem
    # only moves `uses:` refs, not a version string inside a matrix.
    strategy:
      fail-fast: false
      matrix:
        hugo-version: ['0.146.0', '0.166.0']
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ matrix.hugo-version }}
          extended: true
      # exampleSite uses theme = 'lumenveil' but doesn't ship the theme
      # itself; create a symlink so Hugo can find it locally.
      - name: Link theme into exampleSite
        run: |
          mkdir -p exampleSite/themes
          ln -sfn ../.. exampleSite/themes/lumenveil
      - run: cd exampleSite && hugo --minify
      # exampleSite pins highlight = "hljs", so the build above exercises only
      # the opt-in branch of the codeblock render hook. The default Chroma branch
      # is what every non-hljs consumer gets, and it is exactly where the P0
      # fixed in this PR lived: the hook returned nothing, so code blocks
      # disappeared while CI stayed green. Build the default path too.
      #
      # The override lives in a real config file, not an empty
      # HUGO_PARAMS_HIGHLIGHT= environment variable. Hugo can merge configs but
      # not subtract keys, so "unset the pin" has to be stated; whether an empty
      # env var clears a [params] value is version-sensitive behaviour a future
      # Hugo bump could silently break.
      # The Chroma assertion below counts fenced blocks with an inline awk
      # state machine. This test exercises that state machine against every
      # fence form it claims to support, so the claim is enforced rather than
      # asserted in a comment.
      - name: Test the fence counter
        run: scripts/test-fence-count.sh

      - name: Build the default (Chroma) render path
        # This step uses `mapfile` and process substitution, which are bash
        # builtins. ubuntu-latest happens to default `run:` to `bash -e`, but
        # relying on a runner-image default is not a contract — declare it.
        shell: bash
        run: |
          cd exampleSite
          hugo --minify --config hugo.toml,hugo-chroma.toml -d /tmp/pub-chroma
          # `hugo` exits 0 even when a render hook silently drops a code block —
          # that is why the original P0 stayed green. Assert the output instead.
          #
          # Assert over EVERY example post, not one page picked by find order.
          # Two things make a single pick unsafe: find yields directory order,
          # which is not a guarantee, and the example content includes posts
          # with no fenced code block at all — the-aurora-background and the
          # section index itself both render 0 <pre>. Landing on either would
          # report a false "no <pre>" failure against a render hook that is
          # working. So: every page that does contain <pre> must also carry the
          # Chroma container, no page may load the hljs CDN, and at least one
          # page must contain a code block so the step cannot pass on an empty
          # set.
          #
          # -mindepth 2 keeps the posts section index (posts/index.html) out;
          # ! -path '*/page/*' keeps paginated pages out.
          mapfile -t POSTS < <(find /tmp/pub-chroma/posts -mindepth 2 -name index.html \
                                 ! -path '*/page/*' | sort)
          if [ ${#POSTS[@]} -eq 0 ]; then
            echo "::error::no example post pages under /tmp/pub-chroma/posts — did the content or permalink config change?"
            exit 1
          fi
          echo "asserting on ${#POSTS[@]} example post pages"
          # Two independent checks, because neither alone catches a dropped
          # block.
          #
          # (a) Per page: a rendered <pre> must sit inside a .highlight
          #     container. This is the theme's own contract — a block that
          #     escaped the hook's wrapper is a theme bug. The class is matched
          #     WITHOUT requiring `>` to follow it, so an extra attribute on the
          #     container (style=, data-*) does not break the count, and no
          #     bound is placed on anything after it: an earlier
          #     `…>[^<]{0,40}<(div|span|pre)` tracked Chroma's exact wrapper
          #     shape and false-failed on any site that changed it.
          #     Quote-insensitive: whether --minify strips the optional quotes
          #     is the minifier's business, not ours to assert on. The trailing
          #     [ />] is a class-token boundary, not decoration: without it,
          #     class="highlight-wrapper" / "highlight-copy" / "highlightjs"
          #     each count as a container, inflating out_boxes and masking the
          #     very drop this step exists to catch. Chroma emits `highlight` as
          #     a standalone token, so the boundary costs nothing.
          #
          # (b) In aggregate: rendered containers must equal fenced blocks in
          #     the source. This is what actually catches a DROPPED block. An
          #     earlier per-page container/wrapper equality did not: dropping one
          #     rendered container decremented both sides together, so they
          #     stayed equal and the page passed (measured on 0.166.0 — one
          #     container removed from hello-lumenveil left the counts 0 and 0).
          #     The aggregate form holds on a correct build (source=3, output=3)
          #     and breaks on a partial drop (output drops to 2).
          #     Aggregate rather than per-page on purpose: the slug is not
          #     always the filename (douban-card-shortcode is rendered from
          #     douban-card-demo.md), so a per-page source lookup needs a
          #     mapping this step should not have to maintain.
          saw_pre=0
          out_boxes=0
          for p in "${POSTS[@]}"; do
            # `|| true` is REQUIRED, not defensive noise. This step runs under
            # `bash --noprofile --norc -eo pipefail`, so a pipeline's status is
            # its last non-zero command: `grep -o '<pre' F` exits 1 on no match,
            # `| wc -l` exits 0, and with pipefail the assignment inherits the
            # grep failure — set -e then kills the step before any ::error::
            # line. a page with 0 <pre> (the-aurora-background) therefore failed
            # the build on a correct tree.
            n_pre=$(grep -o '<pre' "$p" | wc -l || true)
            n_box=$(grep -oE 'class=["'"'"']?highlight["'"'"']?[ />]' "$p" | wc -l || true)
            out_boxes=$((out_boxes + n_box))
            if [ "$n_pre" -gt 0 ] && [ "$n_box" -eq 0 ]; then
              echo "::error::$n_pre <pre> on the page but no Chroma .highlight container: $p"
              exit 1
            fi
            if [ "$n_pre" -gt 0 ]; then
              saw_pre=$((saw_pre + 1))
            fi
            # Anchored to an actual script load. A bare filename match also
            # fires on prose that merely mentions the CDN — a post documenting
            # the hljs path would false-fail the whole step.
            if grep -Eq '<script[^>]+src=["'"'"'][^"'"'"']*highlight\.min\.js' "$p"; then
              echo "::error::hljs CDN loaded despite highlight being chroma: $p"
              exit 1
            fi
          done
          if [ "$saw_pre" -eq 0 ]; then
            echo "::error::no <pre> in any of the ${#POSTS[@]} example posts — the render hook dropped code blocks"
            exit 1
          fi
          # Fenced blocks in the example content, counted from the source.
          #
          # The source set MUST be the same page set as POSTS above, or the
          # equality is meaningless. A glob over content/posts cannot do that:
          # a draft, future-dated or expired post exists in source and never
          # renders, so one fenced block in a draft turned this step red with a
          # message blaming the render hook. Measured — baseline out=3 src=3;
          # after adding a draft post, out=3 src=4.
          #
          # So the set comes from `hugo list all` joined against the output that
          # actually exists. The join is on the last path segment of the
          # permalink, NOT the filename: output names follow slug/url front
          # matter (douban-card-demo.md renders as douban-card-shortcode), so a
          # filename map would miss real posts. Joining on what rendered also
          # absorbs build exclusions Hugo does not surface in any column.
          # `hugo list all` includes drafts, future and expired pages by design —
          # verified on 0.146.0 and 0.166.0 — which is exactly why the join,
          # rather than a filter on those columns, is what makes the sets agree.
          #
          # _index.md drops out on its own: its output is posts/index.html, which
          # the -mindepth 2 POSTS find excludes, so no segment ever matches.
          # Nested page bundles need no special case either.
          # mktemp rather than $RUNNER_TEMP: that variable only exists on the
          # GitHub runner, so any local run of this step wrote to "/fence-src.txt"
          # and died. The step should not depend on the environment it runs in.
          SRC_LIST=$(mktemp)
          trap 'rm -f "$SRC_LIST"' EXIT
          : > "$SRC_LIST"
          for p in "${POSTS[@]}"; do
            seg=$(basename "$(dirname "$p")")
            hugo list all | awk -F, -v want="$seg" -v out="$SRC_LIST" '
              /^content\/posts\// && !/_index\.md$/ {
                path = $1
                if (match($0, /https?:\/\/[^ ,]+/)) {
                  u = substr($0, RSTART, RLENGTH)
                  sub(/\/+$/, "", u)
                  n = split(u, a, "\/")
                  if (a[n] == want) print path >> out
                }
              }'
          done
          if [ ! -s "$SRC_LIST" ]; then
            echo "::error::could not map any rendered post back to a source file — hugo list all returned nothing usable"
            hugo list all | head -3
            exit 1
          fi
          #
          # Fence counting follows CommonMark's open/close rules rather than
          # toggling on any ``` or ~~~ line:
          #   - a fence may be indented, or follow a list marker (`- ```bash`,
          #     `1. ~~~`) — a leading-whitespace-only regex missed those entirely;
          #   - a fence opens with 3+ of one marker and closes only on the SAME
          #     marker, at least as long, with nothing after it. Without the
          #     length check a 4-backtick outer fence wrapping an inner
          #     3-backtick block toggled twice per outer pair and miscounted;
          #   - a closing fence carries no info string.
          # Verified by ci_fence_test.sh against every form listed above.
          src_boxes=0
          while IFS= read -r md; do
            n=$(awk '
              {
                if (!open) {
                  if (match($0, /^[[:space:]]*([-*+]|[0-9]+[.)])?[[:space:]]*(```+|~~~+)/)) {
                    s = substr($0, RSTART, RLENGTH)
                    ch = (index(s, "`") > 0) ? "`" : "~"
                    if (length(substr(s, index(s, ch))) >= 3) {
                      open = 1; c++
                      clen = length(substr(s, index(s, ch)))
                      cch = ch
                    }
                  }
                } else {
                  if (match($0, /^[[:space:]]*(```+|~~~+)[[:space:]]*$/)) {
                    s = substr($0, RSTART, RLENGTH)
                    if (index(s, cch) > 0 && length(substr(s, index(s, cch))) >= clen) {
                      open = 0
                    }
                  }
                }
              }
              END { print c+0 }' "$md")
            src_boxes=$((src_boxes + n))
          done < "$SRC_LIST"
          if [ "$out_boxes" -ne "$src_boxes" ]; then
            echo "::error::rendered $out_boxes Chroma containers but the source has $src_boxes fenced code blocks — the render hook dropped $((src_boxes - out_boxes))"
            exit 1
          fi
          echo "ok: $out_boxes of $src_boxes fenced code blocks rendered through Chroma across ${#POSTS[@]} post pages"
